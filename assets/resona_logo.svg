<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" role="img" aria-label="RESONA by CODING COBRAS">
  <defs>
    <linearGradient id="rl-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f9ff"/>
      <stop offset="1" stop-color="#c6d7f0"/>
    </linearGradient>
  </defs>

  <!-- ===== mark (scaled cobra + waveform + brackets), on the left ===== -->
  <g transform="translate(10,20) scale(0.508)">
    <!-- serpentine body -->
    <path fill="none" stroke="url(#rl-body)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"
          d="M302 214 C302 262 238 268 238 320 C238 362 300 368 300 414 C300 440 274 452 258 440"/>
    <!-- cobra head + gentle hood -->
    <path fill="url(#rl-body)" d="M236 214 C226 186 240 156 268 146 C292 138 322 146 338 164 C352 180 356 200 350 216 C346 228 336 236 324 238 C330 226 330 212 322 202 C312 190 294 186 280 192 C266 198 258 210 258 224 C250 226 242 222 236 214 Z"/>
    <!-- eye -->
    <ellipse cx="322" cy="180" rx="9" ry="12" fill="#1FE3D4" transform="rotate(24 322 180)"/>
    <!-- brackets -->
    <path fill="none" stroke="#1FE3D4" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" d="M150 250 L106 302 L150 354"/>
    <path fill="none" stroke="#1FE3D4" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" d="M362 250 L406 302 L362 354"/>
    <!-- waveform -->
    <g fill="#1FE3D4">
      <rect x="184" y="274" width="13" height="56"  rx="6.5"/>
      <rect x="209" y="246" width="13" height="112" rx="6.5"/>
      <rect x="234" y="218" width="13" height="168" rx="6.5"/>
      <rect x="259" y="198" width="13" height="208" rx="6.5"/>
      <rect x="284" y="218" width="13" height="168" rx="6.5"/>
      <rect x="309" y="246" width="13" height="112" rx="6.5"/>
      <rect x="334" y="274" width="13" height="56"  rx="6.5"/>
    </g>
  </g>

  <!-- ===== wordmark ===== -->
  <text x="298" y="150" font-family="'DejaVu Sans', 'Helvetica Neue', Arial, sans-serif"
        font-size="92" font-weight="800" letter-spacing="2" fill="#22c55e">RESONA</text>
  <text x="302" y="210" font-family="'DejaVu Serif', Georgia, 'Times New Roman', serif"
        font-style="italic" font-size="40" letter-spacing="1" fill="#1FE3D4">by coding cobras</text>
</svg>
